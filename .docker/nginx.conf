# Nginx reverse proxy for mcp-postgresdb-readonly
# Place this in /etc/nginx/sites-available/mcp-postgresdb and symlink to sites-enabled.
# Assumes SSL certificate managed by Certbot (Let's Encrypt).
#
# Replace:
#   mcp.example.com  →  your actual domain
#   /etc/letsencrypt →  your cert path if different

server {
    listen 80;
    server_name mcp.example.com;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mcp.example.com;

    ssl_certificate     /etc/letsencrypt/live/mcp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.example.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy no-referrer;

    # MCP endpoint, allow long-lived connections (SSE upgrade if needed)
    location /mcp {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Disable buffering for streaming responses
        proxy_buffering    off;
        proxy_cache        off;

        # Timeouts generous enough for slow queries
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
        proxy_connect_timeout 10s;

        # Allow large request bodies (parameterized queries)
        client_max_body_size 1m;
    }

    location /health {
        proxy_pass         http://127.0.0.1:3000;
        proxy_set_header   Host $host;
        access_log         off;
    }

    # Deny everything else
    location / {
        return 404;
    }
}
